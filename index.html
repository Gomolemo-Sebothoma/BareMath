<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BareMath</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1d2430;
    --border: #2a3240;
    --text: #e6e9ef;
    --text-dim: #8b94a3;
    --accent: #5ee6c8;
    --accent-2: #f2a65a;
    --danger: #e05d6f;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #eef0f3;
      --border: #dadfe6;
      --text: #171a1f;
      --text-dim: #5b6472;
      --accent: #0f9c82;
      --accent-2: #c1750f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #161b22; --panel-2: #1d2430; --border: #2a3240;
    --text: #e6e9ef; --text-dim: #8b94a3; --accent: #5ee6c8; --accent-2: #f2a65a;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef0f3; --border: #dadfe6;
    --text: #171a1f; --text-dim: #5b6472; --accent: #0f9c82; --accent-2: #c1750f;
  }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 14px 18px calc(10px + env(safe-area-inset-top, 0px));
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header h1 span { color: var(--accent); }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  #themeToggle {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 7px;
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #themeToggle:hover { border-color: var(--accent); }
  .tabs button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 7px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .tabs button.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }

  main { max-width: 1400px; margin: 0 auto; padding: 18px; }
  .view { display: none; }
  .view.active { display: block; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; }
  }

  .stage {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .stage-toolbar {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 10px; border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .stage-toolbar button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .stage-toolbar button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .stage-toolbar button:hover { border-color: var(--accent); }
  .stage-toolbar .sep { width: 1px; background: var(--border); margin: 2px 4px; }
  .hint { font-size: 12px; color: var(--text-dim); padding: 8px 12px 0; }

  canvas#graphCanvas { display: block; width: 100%; height: 520px; touch-action: none; cursor: crosshair; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; color: var(--text-dim); }
  select, input[type=number], input[type=text] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 8px;
    border-radius: 6px;
    font-size: 13.5px;
    width: 100%;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .checkline { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); }
  .btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 9px 12px;
    border-radius: 7px;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
  }
  .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-weight: 500; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

  #log {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  #log .cur { color: var(--accent); }

  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  textarea.code {
    width: 100%;
    min-height: 150px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 10px;
    border-radius: 7px;
    resize: vertical;
  }
  #codeStatus { font-size: 12px; font-family: var(--mono); min-height: 16px; }
  #codeStatus.err { color: var(--danger); }
  #codeStatus.ok { color: var(--accent); }

  #shape2d { display: block; width: 100%; height: 220px; background: var(--panel-2); border-radius: 7px; touch-action: none; cursor: crosshair; }
  #threeHost { display: block; width: 100%; height: 460px; border-radius: 10px; cursor: grab; background: var(--panel-2); }
  #threeHost:active { cursor: grabbing; }

  h2.section { font-size: 12px; text-transform: none; color: var(--text-dim); margin: 0 0 -4px; font-weight: 600; letter-spacing: 0.02em; }
  .divider { height: 1px; background: var(--border); margin: 2px 0; }
</style>
</head>
<body>

<header>
  <h1>Bare<span>Math</span></h1>
  <div class="tabs">
    <button id="tabGraphBtn" class="active">Graph Animator</button>
    <button id="tab3DBtn">2D → 3D</button>
  </div>
  <button id="themeToggle" title="Toggle light / dark theme">🌙</button>
</header>

<main>

  <!-- ===================== GRAPH VIEW ===================== -->
  <section id="graphView" class="view active">
    <div class="layout">
      <div class="stage">
        <div class="stage-toolbar">
          <button id="modeAdd" class="on">Add node</button>
          <button id="modeEdge">Add edge</button>
          <button id="modeMove">Move</button>
          <button id="modeDelete">Delete</button>
          <div class="sep"></div>
          <label class="checkline"><input type="checkbox" id="weightedChk" checked> Weighted</label>
          <label class="checkline"><input type="checkbox" id="directedChk"> Directed</label>
        </div>
        <div class="hint" id="graphHint">Tap the canvas to place nodes.</div>
        <canvas id="graphCanvas"></canvas>
        <div style="padding:10px 12px;" class="legend">
          <span><i class="dot" style="background:#8b94a3"></i>unvisited</span>
          <span><i class="dot" style="background:#5ee6c8"></i>current</span>
          <span><i class="dot" style="background:#4c9f88"></i>visited</span>
        </div>
      </div>

      <div class="panel">
        <h2 class="section">Algorithm</h2>
        <div class="field">
          <label>Traversal</label>
          <select id="algoSelect">
            <option value="bfs">Breadth-First Search</option>
            <option value="dfs">Depth-First Search</option>
            <option value="mbfs">Moore's BFS (level labels)</option>
            <option value="dijkstra">Dijkstra (shortest path)</option>
            <option value="prim">Prim's Algorithm (MST)</option>
            <option value="kruskal">Kruskal's Algorithm (MST)</option>
          </select>
          <div class="hint" id="algoHint" style="padding:0;"></div>
        </div>
        <div class="row">
          <div class="field" id="startField">
            <label>Start node</label>
            <select id="startSelect"></select>
          </div>
          <div class="field" id="endField">
            <label>End node (optional)</label>
            <select id="endSelect"><option value="">— none —</option></select>
          </div>
        </div>
        <div class="field">
          <label>Speed: <span id="speedVal">600ms</span> per step</label>
          <input type="range" id="speedRange" min="80" max="1500" value="600">
        </div>
        <div class="btnrow">
          <button class="btn" id="runBtn">▶ Run</button>
          <button class="btn secondary" id="resetColorsBtn">Reset colors</button>
        </div>
        <div class="divider"></div>
        <h2 class="section">Log</h2>
        <div id="log">Draw a graph, then press Run.</div>
        <div class="divider"></div>
        <button class="btn danger" id="clearGraphBtn">Clear graph</button>
      </div>
    </div>
  </section>

  <!-- ===================== 3D VIEW ===================== -->
  <section id="threeDView" class="view">
    <div class="layout">
      <div class="stage">
        <div class="stage-toolbar">
          <span style="font-size:12px;color:var(--text-dim);align-self:center;">drag to rotate · scroll to zoom</span>
          <div class="sep"></div>
          <label class="checkline"><input type="checkbox" id="axesChk" checked> Axes</label>
          <label class="checkline"><input type="checkbox" id="gridChk" checked> Grid</label>
          <label class="checkline"><input type="checkbox" id="wireChk"> Wireframe</label>
        </div>
        <canvas id="threeHost"></canvas>
      </div>

      <div class="panel">
        <h2 class="section">1 · Draw a 2D shape</h2>
        <div class="hint" style="padding:0;">Click to place points, then close the shape.</div>
        <canvas id="shape2d"></canvas>
        <div class="btnrow">
          <button class="btn secondary" id="closeShapeBtn">Close shape</button>
          <button class="btn secondary" id="clearShapeBtn">Clear</button>
        </div>

        <div class="divider"></div>
        <h2 class="section">2 · Turn it into 3D</h2>
        <div class="field">
          <label>Preset</label>
          <select id="presetSelect">
            <option value="extrude">Extrude (push along Z)</option>
            <option value="lathe">Revolve around axis</option>
            <option value="twist">Twist-extrude</option>
          </select>
        </div>
        <div class="row">
          <div class="field"><label id="paramALabel">Depth</label><input type="number" id="paramA" value="2" step="0.1"></div>
          <div class="field"><label id="paramBLabel">Segments</label><input type="number" id="paramB" value="16" step="1"></div>
        </div>
        <button class="btn" id="applyPresetBtn">Apply preset</button>

        <div class="divider"></div>
        <h2 class="section">3 · Or write your own code</h2>
        <textarea class="code" id="codeBox" spellcheck="false"></textarea>
        <div class="btnrow">
          <button class="btn" id="runCodeBtn">Run code</button>
          <span id="codeStatus"></span>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
// dark/light mode toggle, saves your choice so it remembers next time
(function initTheme() {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  let stored = null;
  try { stored = localStorage.getItem('baremath-theme'); } catch (e) {}
  const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const initial = stored || (systemDark ? 'dark' : 'light');
  applyTheme(initial);

  btn.onclick = () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  };

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem('baremath-theme', theme); } catch (e) {}
  }
})();

// switching between the graph tab and the 3d tab
const tabGraphBtn = document.getElementById('tabGraphBtn');
const tab3DBtn = document.getElementById('tab3DBtn');
const graphView = document.getElementById('graphView');
const threeDView = document.getElementById('threeDView');
let threeInitDone = false; // only set up the 3d stuff once, otherwise it breaks

tabGraphBtn.onclick = () => switchTab('graph');
tab3DBtn.onclick = () => switchTab('3d');

function switchTab(which) {
  const isGraph = which === 'graph';
  tabGraphBtn.classList.toggle('active', isGraph);
  tab3DBtn.classList.toggle('active', !isGraph);
  graphView.classList.toggle('active', isGraph);
  threeDView.classList.toggle('active', !isGraph);
  if (!isGraph) {
    if (!threeInitDone) { initThree(); threeInitDone = true; }
    // gotta resize after the tab is actually visible or the canvas thinks its 0x0
    requestAnimationFrame(() => { resizeThree(); resizeShapeCanvas(); });
  } else {
    requestAnimationFrame(resizeGraphCanvas);
  }
}

// ------------------------------
// GRAPH PART (the traversal animator thing)
// ------------------------------
const gCanvas = document.getElementById('graphCanvas');
const gCtx = gCanvas.getContext('2d');
const weightedChk = document.getElementById('weightedChk');
const directedChk = document.getElementById('directedChk');
const graphHint = document.getElementById('graphHint');
const logEl = document.getElementById('log');

let nodes = [];   // {id, x, y, label}
let edges = [];   // {a, b, w}
let nextLabelIndex = 0;
let mode = 'add';
let pendingEdgeFrom = null;
let dragNode = null;
let running = false;

function label(i) {
  return String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '');
}

function resizeGraphCanvas() {
  const rect = gCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  gCanvas.width = rect.width * dpr;
  gCanvas.height = rect.height * dpr;
  gCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGraph();
}
window.addEventListener('resize', resizeGraphCanvas);

function canvasPoint(evt) {
  const rect = gCanvas.getBoundingClientRect();
  const t = evt.touches ? evt.touches[0] : evt;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

function nodeAt(pt) {
  return nodes.find(n => Math.hypot(n.x - pt.x, n.y - pt.y) < 18);
}

function edgeAt(pt) {
  for (const e of edges) {
    const a = nodes.find(n => n.id === e.a), b = nodes.find(n => n.id === e.b);
    if (!a || !b) continue;
    const d = distToSegment(pt, a, b);
    if (d < 8) return e;
  }
  return null;
}
function distToSegment(p, a, b) {
  const l2 = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
  t = Math.max(0, Math.min(1, t));
  const px = a.x + t * (b.x - a.x), py = a.y + t * (b.y - a.y);
  return Math.hypot(p.x - px, p.y - py);
}

function setMode(m) {
  mode = m;
  pendingEdgeFrom = null;
  ['modeAdd', 'modeEdge', 'modeMove', 'modeDelete'].forEach(id => document.getElementById(id).classList.remove('on'));
  document.getElementById({ add: 'modeAdd', edge: 'modeEdge', move: 'modeMove', delete: 'modeDelete' }[m]).classList.add('on');
  graphHint.textContent = {
    add: 'Tap the canvas to place nodes.',
    edge: 'Tap a start node, then an end node, to connect them.',
    move: 'Drag nodes to reposition them.',
    delete: 'Tap a node or edge to remove it.'
  }[m];
  drawGraph();
}
document.getElementById('modeAdd').onclick = () => setMode('add');
document.getElementById('modeEdge').onclick = () => setMode('edge');
document.getElementById('modeMove').onclick = () => setMode('move');
document.getElementById('modeDelete').onclick = () => setMode('delete');

function pointerDown(evt) {
  if (running) return;
  evt.preventDefault();
  const pt = canvasPoint(evt);
  if (mode === 'add') {
    if (nodeAt(pt)) return;
    const id = 'n' + Date.now() + Math.random().toString(16).slice(2, 6);
    nodes.push({ id, x: pt.x, y: pt.y, label: label(nextLabelIndex++) });
    refreshNodeSelectors();
    drawGraph();
  } else if (mode === 'edge') {
    const n = nodeAt(pt);
    if (!n) return;
    if (!pendingEdgeFrom) {
      pendingEdgeFrom = n;
    } else if (pendingEdgeFrom.id !== n.id) {
      let w = 1;
      if (weightedChk.checked) {
        const val = prompt('Edge weight:', '1');
        if (val === null) { pendingEdgeFrom = null; drawGraph(); return; }
        w = parseFloat(val) || 1;
      }
      edges.push({ a: pendingEdgeFrom.id, b: n.id, w });
      pendingEdgeFrom = null;
    } else {
      pendingEdgeFrom = null;
    }
    drawGraph();
  } else if (mode === 'move') {
    dragNode = nodeAt(pt) || null;
  } else if (mode === 'delete') {
    const n = nodeAt(pt);
    if (n) {
      nodes = nodes.filter(x => x.id !== n.id);
      edges = edges.filter(e => e.a !== n.id && e.b !== n.id);
      refreshNodeSelectors();
      drawGraph();
      return;
    }
    const e = edgeAt(pt);
    if (e) { edges = edges.filter(x => x !== e); drawGraph(); }
  }
}
function pointerMove(evt) {
  if (mode === 'move' && dragNode) {
    evt.preventDefault();
    const pt = canvasPoint(evt);
    dragNode.x = pt.x; dragNode.y = pt.y;
    drawGraph();
  }
}
function pointerUp() { dragNode = null; }

gCanvas.addEventListener('mousedown', pointerDown);
gCanvas.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
gCanvas.addEventListener('touchstart', pointerDown, { passive: false });
gCanvas.addEventListener('touchmove', pointerMove, { passive: false });
window.addEventListener('touchend', pointerUp);

function refreshNodeSelectors() {
  const startSel = document.getElementById('startSelect');
  const endSel = document.getElementById('endSelect');
  const opts = nodes.map(n => `<option value="${n.id}">${n.label}</option>`).join('');
  startSel.innerHTML = opts || '<option value="">—</option>';
  endSel.innerHTML = '<option value="">— none —</option>' + opts;
}

function updateAlgoFields() {
  const algo = document.getElementById('algoSelect').value;
  const startField = document.getElementById('startField');
  const endField = document.getElementById('endField');
  const hint = document.getElementById('algoHint');
  const needsStart = algo !== 'kruskal';
  const needsEnd = algo === 'bfs' || algo === 'dfs' || algo === 'mbfs' || algo === 'dijkstra';
  startField.style.display = needsStart ? '' : 'none';
  endField.style.display = needsEnd ? '' : 'none';
  hint.textContent = {
    bfs: '',
    dfs: '',
    mbfs: 'Labels each node with its distance (level) from the start node.',
    dijkstra: '',
    prim: 'Grows a minimum spanning tree outward from the start node. Uses edge weights.',
    kruskal: 'Builds a minimum spanning tree by adding the cheapest edge that never forms a cycle, anywhere in the graph — no start node needed.',
  }[algo] || '';
}
document.getElementById('algoSelect').onchange = updateAlgoFields;
updateAlgoFields();

function drawGraph(state) {
  state = state || {};
  const rect = gCanvas.getBoundingClientRect();
  gCtx.clearRect(0, 0, rect.width, rect.height);

  // draw the little dots in the background so it looks like graph paper
  gCtx.fillStyle = 'rgba(139,148,163,0.15)';
  for (let x = 20; x < rect.width; x += 28) for (let y = 20; y < rect.height; y += 28) {
    gCtx.beginPath(); gCtx.arc(x, y, 1, 0, 7); gCtx.fill();
  }

  const byId = id => nodes.find(n => n.id === id);
  const traversed = state.traversedEdges || [];

  // draw all the normal edges first (gray lines)
  edges.forEach(e => {
    const a = byId(e.a), b = byId(e.b);
    if (!a || !b) return;
    gCtx.strokeStyle = 'rgba(139,148,163,0.5)';
    gCtx.lineWidth = 1.6;
    gCtx.beginPath();
    gCtx.moveTo(a.x, a.y); gCtx.lineTo(b.x, b.y);
    gCtx.stroke();
    if (directedChk.checked) drawEdgeArrow(a, b, 'rgba(139,148,163,0.8)');
    if (weightedChk.checked) {
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      gCtx.fillStyle = getComputedStyle(document.body).getPropertyValue('--panel') || '#161b22';
      gCtx.fillRect(mx - 10, my - 8, 20, 16);
      gCtx.fillStyle = '#f2a65a';
      gCtx.font = '11px monospace';
      gCtx.textAlign = 'center'; gCtx.textBaseline = 'middle';
      gCtx.fillText(e.w, mx, my);
    }
  });

  // now draw the edges the algorithm has actually walked over, on top, in green
  traversed.forEach(pair => {
    const a = byId(pair.a), b = byId(pair.b);
    if (!a || !b) return;
    gCtx.strokeStyle = '#5ee6c8';
    gCtx.lineWidth = 3;
    gCtx.beginPath();
    gCtx.moveTo(a.x, a.y); gCtx.lineTo(b.x, b.y);
    gCtx.stroke();
    drawEdgeArrow(a, b, '#5ee6c8');
  });

  if (pendingEdgeFrom) {
    gCtx.beginPath();
    gCtx.arc(pendingEdgeFrom.x, pendingEdgeFrom.y, 21, 0, 7);
    gCtx.strokeStyle = '#f2a65a'; gCtx.lineWidth = 2; gCtx.stroke();
  }

  // finally the vertices on top of everything. only 2 colors matter here:
  // green = visited, teal = the one we're on right now
  nodes.forEach(n => {
    let fill = '#8b94a3';
    if (state.visited && state.visited.has(n.id)) fill = '#4c9f88';
    if (state.current === n.id) fill = '#5ee6c8';
    gCtx.beginPath();
    gCtx.arc(n.x, n.y, 17, 0, 7);
    gCtx.fillStyle = fill;
    gCtx.fill();
    gCtx.lineWidth = 2; gCtx.strokeStyle = '#0e1116'; gCtx.stroke();
    gCtx.fillStyle = '#0e1116';
    gCtx.font = 'bold 12px sans-serif';
    gCtx.textAlign = 'center'; gCtx.textBaseline = 'middle';
    gCtx.fillText(n.label, n.x, n.y);

    if (state.labels && state.labels[n.id] !== undefined) {
      gCtx.fillStyle = '#f2a65a';
      gCtx.font = 'bold 11px monospace';
      gCtx.textAlign = 'center'; gCtx.textBaseline = 'middle';
      gCtx.fillText(state.labels[n.id], n.x + 20, n.y - 20);
    }
  });
}

function drawEdgeArrow(a, b, color) {
  const angle = Math.atan2(b.y - a.y, b.x - a.x);
  const len = Math.hypot(b.x - a.x, b.y - a.y);
  if (len < 34) return;
  const tx = b.x - Math.cos(angle) * 20, ty = b.y - Math.sin(angle) * 20;
  gCtx.beginPath();
  gCtx.moveTo(tx, ty);
  gCtx.lineTo(tx - 9 * Math.cos(angle - 0.4), ty - 9 * Math.sin(angle - 0.4));
  gCtx.lineTo(tx - 9 * Math.cos(angle + 0.4), ty - 9 * Math.sin(angle + 0.4));
  gCtx.closePath();
  gCtx.fillStyle = color;
  gCtx.fill();
}

function adjacency() {
  const adj = {};
  nodes.forEach(n => adj[n.id] = []);
  edges.forEach(e => {
    adj[e.a].push({ to: e.b, w: e.w, edge: e });
    if (!directedChk.checked) adj[e.b].push({ to: e.a, w: e.w, edge: e });
  });
  return adj;
}

// prim/kruskal don't care about the directed checkbox, MST is always undirected
function undirectedAdjacency() {
  const adj = {};
  nodes.forEach(n => adj[n.id] = []);
  edges.forEach(e => {
    adj[e.a].push({ to: e.b, w: e.w });
    adj[e.b].push({ to: e.a, w: e.w });
  });
  return adj;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
function speedMs() { return parseInt(document.getElementById('speedRange').value, 10); }
function logLine(text, isCurrent) {
  const div = document.createElement('div');

document.getElementById('runBtn').onclick = async () => {
  if (running || nodes.length === 0) return;
  const algo = document.getElementById('algoSelect').value;
  const startId = document.getElementById('startSelect').value;
  const endId = document.getElementById('endSelect').value;
  if (!startId && algo !== 'kruskal') return;
  running = true;
  document.getElementById('runBtn').disabled = true;
  logEl.textContent = '';
  const adj = adjacency();
  const nodeLabel = id => nodes.find(n => n.id === id).label;

  if (algo === 'bfs' || algo === 'dfs') {
    const visited = new Set();
    const cameFromEdge = {}; // childId -> {a,b} edge used to reach it
    const structure = [{ id: startId, from: null }]; // queue (bfs) or stack (dfs)
    logLine(`Starting ${algo.toUpperCase()} from ${nodeLabel(startId)}`, true);
    while (structure.length) {
      const { id: curId, from } = algo === 'bfs' ? structure.shift() : structure.pop();
      if (visited.has(curId)) continue;
      visited.add(curId);
      if (from) cameFromEdge[curId] = from;
      const traversedEdges = Object.values(cameFromEdge);
      drawGraph({ visited, current: curId, traversedEdges });
      logLine(`visit ${nodeLabel(curId)}`, true);
      await sleep(speedMs());
      for (const { to, edge } of adj[curId]) {
        if (!visited.has(to)) structure.push({ id: to, from: { a: curId, b: to } });
      }
      if (endId && curId === endId) { logLine(`reached target ${nodeLabel(endId)}`, true); break; }
    }
    drawGraph({ visited, traversedEdges: Object.values(cameFromEdge) });
    logLine(`done — visited ${visited.size} node(s)`);
  }

  if (algo === 'mbfs') {
    const visited = new Set();
    const level = { [startId]: 0 };
    const cameFromEdge = {};
    const queue = [startId];
    logLine(`Starting Moore's BFS from ${nodeLabel(startId)} (level 0)`, true);
    while (queue.length) {
      const curId = queue.shift();
      if (visited.has(curId)) continue;
      visited.add(curId);
      const traversedEdges = Object.values(cameFromEdge);
      drawGraph({ visited, current: curId, traversedEdges, labels: level });
      logLine(`visit ${nodeLabel(curId)}  (level ${level[curId]})`, true);
      await sleep(speedMs());
      for (const { to } of adj[curId]) {
        if (!(to in level)) {
          level[to] = level[curId] + 1;
          cameFromEdge[to] = { a: curId, b: to };
          queue.push(to);
        }
      }
      if (endId && curId === endId) { logLine(`reached target ${nodeLabel(endId)} — d(${nodeLabel(startId)},${nodeLabel(endId)}) = ${level[endId]}`, true); break; }
    }
    drawGraph({ visited, traversedEdges: Object.values(cameFromEdge), labels: level });
    if (!endId) {
      const ecc = Math.max(...Object.values(level));
      logLine(`done — levels assigned to ${visited.size} node(s). Eccentricity of ${nodeLabel(startId)} = ${ecc}`);
    }
  }

  if (algo === 'dijkstra') {
    const dist = {}; nodes.forEach(n => dist[n.id] = Infinity);
    dist[startId] = 0;
    const prev = {};
    const visited = new Set();
    const remaining = new Set(nodes.map(n => n.id));
    logLine(`Starting Dijkstra from ${nodeLabel(startId)}`, true);
    while (remaining.size) {
      let curId = null, best = Infinity;
      remaining.forEach(id => { if (dist[id] < best) { best = dist[id]; curId = id; } });
      if (curId === null) break;
      remaining.delete(curId); visited.add(curId);
      const traversedEdges = Object.keys(prev).filter(k => visited.has(k)).map(k => ({ a: prev[k], b: k }));
      drawGraph({ visited, current: curId, traversedEdges });
      logLine(`visit ${nodeLabel(curId)}  (dist=${dist[curId]})`, true);
      await sleep(speedMs());
      if (endId && curId === endId) break;
      for (const { to, w } of adj[curId]) {
        if (visited.has(to)) continue;
        const alt = dist[curId] + w;
        if (alt < dist[to]) { dist[to] = alt; prev[to] = curId; logLine(`  relax ${nodeLabel(to)} → ${alt}`); }
      }
    }
    const traversedEdges = Object.keys(prev).filter(k => visited.has(k)).map(k => ({ a: prev[k], b: k }));
    drawGraph({ visited, traversedEdges });
    if (endId) {
      if (dist[endId] === Infinity) {
        logLine(`no path to ${nodeLabel(endId)}`);
      } else {
        const path = []; let cur = endId;
        while (cur !== undefined) { path.unshift(nodeLabel(cur)); cur = prev[cur]; }
        logLine(`shortest path: ${path.join(' → ')}  (length ${dist[endId]})`, true);
      }
    } else {
      logLine('done — shortest distances computed for all nodes');
    }
  }

  if (algo === 'prim') {
    const uAdj = undirectedAdjacency();
    const inTree = new Set([startId]);
    const treeEdges = [];
    let totalWeight = 0;
    logLine(`Starting Prim's Algorithm from ${nodeLabel(startId)}`, true);
    while (inTree.size < nodes.length) {
      let best = null; // { a, b, w }
      inTree.forEach(a => {
        uAdj[a].forEach(({ to: b, w }) => {
          if (!inTree.has(b) && (!best || w < best.w)) best = { a, b, w };
        });
      });
      if (!best) { logLine('graph is disconnected from the start node — stopping'); break; }
      inTree.add(best.b);
      treeEdges.push({ a: best.a, b: best.b });
      totalWeight += best.w;
      drawGraph({ visited: inTree, current: best.b, traversedEdges: treeEdges });
      logLine(`add edge ${nodeLabel(best.a)}–${nodeLabel(best.b)}  (weight ${best.w})`, true);
      await sleep(speedMs());
    }
    drawGraph({ visited: inTree, traversedEdges: treeEdges });
    logLine(`done — minimum spanning tree weight = ${totalWeight}`);
  }

  if (algo === 'kruskal') {
    const parent = {}; nodes.forEach(n => parent[n.id] = n.id);
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    function union(a, b) { const ra = find(a), rb = find(b); if (ra === rb) return false; parent[ra] = rb; return true; }

    const sortedEdges = [...edges].sort((a, b) => a.w - b.w);
    const treeEdges = [];
    const included = new Set();
    let totalWeight = 0;
    logLine('Starting Kruskal\'s Algorithm — sorting edges by weight', true);
    for (const e of sortedEdges) {
      await sleep(speedMs() / 2);
      if (find(e.a) === find(e.b)) {
        logLine(`skip ${nodeLabel(e.a)}–${nodeLabel(e.b)} (weight ${e.w}) — would form a cycle`);
        continue;
      }
      union(e.a, e.b);
      treeEdges.push({ a: e.a, b: e.b });
      included.add(e.a); included.add(e.b);
      totalWeight += e.w;
      drawGraph({ visited: included, current: e.b, traversedEdges: treeEdges });
      logLine(`add edge ${nodeLabel(e.a)}–${nodeLabel(e.b)}  (weight ${e.w})`, true);
      await sleep(speedMs() / 2);
      if (treeEdges.length === nodes.length - 1) break;
    }
    drawGraph({ visited: included, traversedEdges: treeEdges });
    if (treeEdges.length < nodes.length - 1) {
      logLine(`done — graph is disconnected, spanning forest weight = ${totalWeight}`);
    } else {
      logLine(`done — minimum spanning tree weight = ${totalWeight}`);
    }
  }

  running = false;
  document.getElementById('runBtn').disabled = false;
};

// takes the raw canvas pixel points and turns them into small centered coords
// (also flips y because canvas y goes down but our "3d world" y goes up)
function normalizedShapePoints() {
  if (shapePoints.length < 3) return null;
  const xs = shapePoints.map(p => p.x), ys = shapePoints.map(p => p.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const scale = 1 / 60;
  return shapePoints.map(p => ({ x: (p.x - cx) * scale, y: -(p.y - cy) * scale }));
}

// ==========================================================
// THIS IS THE 3D PART. no three.js, no libraries, just math.
// basically: turn shapes into a list of points + triangles,
// then project those points onto the 2d canvas using a fake
// camera, and color each triangle based on a fake light.
// took me a while to get this working lol
// ==========================================================

// just basic vector math on [x,y,z] arrays, nothing fancy
const vec3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
  length: a => Math.sqrt(a[0]*a[0] + a[1]*a[1] + a[2]*a[2]),
  normalize: a => { const l = vec3.length(a) || 1e-9; return [a[0]/l, a[1]/l, a[2]/l]; },
};

// this part turns the shape you draw (just an outline) into actual triangles.
// its called "ear clipping" - i looked this up, basically you keep finding a
// corner that you can cut off without the cut crossing the rest of the shape,
// cut it off (that becomes one triangle), and repeat till only 3 points left
function cross2(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }
function signedArea(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a / 2;
}
function pointInTriangle(p, a, b, c) {
  const d1 = cross2(p, a, b), d2 = cross2(p, b, c), d3 = cross2(p, c, a);
  const hasNeg = d1 < 0 || d2 < 0 || d3 < 0;
  const hasPos = d1 > 0 || d2 > 0 || d3 > 0;
  return !(hasNeg && hasPos);
}
function triangulate(points) {
  let idx = points.map((_, i) => i);
  if (signedArea(points) < 0) idx.reverse();   // needs to go counter-clockwise or this breaks
  const tris = [];
  let guard = 0; // just here so it cant infinite loop if something weird happens
  while (idx.length > 3 && guard++ < 8000) {
    let clipped = false;
    for (let i = 0; i < idx.length; i++) {
      const iPrev = idx[(i - 1 + idx.length) % idx.length];
      const iCur = idx[i];
      const iNext = idx[(i + 1) % idx.length];
      const a = points[iPrev], b = points[iCur], c = points[iNext];
      if (cross2(a, b, c) <= 1e-9) continue;              // this corner points inward, skip it
      let isEar = true;
      for (const j of idx) {
        if (j === iPrev || j === iCur || j === iNext) continue;
        if (pointInTriangle(points[j], a, b, c)) { isEar = false; break; }
      }
      if (isEar) { tris.push([iPrev, iCur, iNext]); idx.splice(i, 1); clipped = true; break; }
    }
    if (!clipped) break;   // weird shape, just stop instead of crashing
  }
  if (idx.length === 3) tris.push([idx[0], idx[1], idx[2]]);
  return tris;
}

// these build the actual 3d shapes (list of points + which points make each triangle)
function buildExtrude(points2D, depth) {
  const n = points2D.length;
  const tris = triangulate(points2D);
  const vertices = [
    ...points2D.map(p => [p.x, p.y, depth / 2]),
    ...points2D.map(p => [p.x, p.y, -depth / 2]),
  ];
  const faces = [];
  tris.forEach(([i, j, k]) => faces.push([i, j, k]));                 // front cap
  tris.forEach(([i, j, k]) => faces.push([n + i, n + j, n + k]));     // back cap
  for (let i = 0; i < n; i++) {
    const a = i, b = (i + 1) % n, c = n + ((i + 1) % n), d = n + i;
    faces.push([a, b, c], [a, c, d]);                                 // side wall
  }
  return { vertices, faces };
}

function buildLathe(profile, segments) {
  const m = profile.length;
  const vertices = [];
  for (let s = 0; s <= segments; s++) {
    const theta = (s / segments) * Math.PI * 2;
    const ct = Math.cos(theta), st = Math.sin(theta);
    profile.forEach(p => { const r = Math.max(0, p.x); vertices.push([r * ct, p.y, r * st]); });
  }
  const faces = [];
  for (let s = 0; s < segments; s++) {
    for (let i = 0; i < m - 1; i++) {
      const a = s*m+i, b = s*m+i+1, c = (s+1)*m+i+1, d = (s+1)*m+i;
      faces.push([a, b, c], [a, c, d]);
    }
  }
  return { vertices, faces };
}

function buildTwist(points2D, depth, turns, layers) {
  const n = points2D.length;
  const vertices = [];
  for (let L = 0; L <= layers; L++) {
    const t = L / layers;
    const z = -depth / 2 + t * depth;
    const ang = t * turns * Math.PI * 2;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    points2D.forEach(p => vertices.push([p.x*ca - p.y*sa, p.x*sa + p.y*ca, z]));
  }
  const faces = [];
  for (let L = 0; L < layers; L++) {
    for (let i = 0; i < n; i++) {
      const ni = (i + 1) % n;
      const a = L*n+i, b = L*n+ni, c = (L+1)*n+ni, d = (L+1)*n+i;
      faces.push([a, b, c], [a, c, d]);
    }
  }
  const tris = triangulate(points2D);
  tris.forEach(([i, j, k]) => faces.push([i, j, k]));                       // bottom cap
  const top = layers * n;
  tris.forEach(([i, j, k]) => faces.push([top + i, top + j, top + k]));     // top cap
  return { vertices, faces };
}

const meshLib = { vec3, triangulate, extrude: buildExtrude, lathe: buildLathe, twist: buildTwist };

// this is the "camera" - just some angles and a distance, no actual camera object
let rotX = 0.5, rotY = -0.6, camDist = 8;
const FOCAL = 480; // higher = more zoomed in, just played with numbers till it looked right
const LIGHT_DIR = vec3.normalize([0.5, 0.8, 0.6]); // light always comes from this direction
let currentMesh = null;
let host3d, ctx3d;

function initThree() {
  host3d = document.getElementById('threeHost');
  ctx3d = host3d.getContext('2d');

  attachDragControls(host3d);

function resizeThree() {

  ctx3d.setTransform(dpr, 0, 0, dpr, 0, 0);
  host3d._cssW = rect.width; host3d._cssH = rect.height || 460;
}

function attachDragControls(host) {
  let dragging = false, lastX = 0, lastY = 0;
  const down = e => { dragging = true; const p = e.touches ? e.touches[0] : e; lastX = p.clientX; lastY = p.clientY; };
  const move = e => {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - lastX, dy = p.clientY - lastY;
    lastX = p.clientX; lastY = p.clientY;
    rotY -= dx * 0.01;
    rotX = Math.max(-1.4, Math.min(1.4, rotX + dy * 0.01));
    if (e.touches) e.preventDefault();
  };
  const up = () => dragging = false;
  host.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  host.addEventListener('touchstart', down, { passive: true });
  host.addEventListener('touchmove', move, { passive: false });
  window.addEventListener('touchend', up);
  host.addEventListener('wheel', e => {
    e.preventDefault();
    camDist = Math.max(2.5, Math.min(30, camDist + e.deltaY * 0.01));
  }, { passive: false });
}

function makeCamera() {
  const camPos = [
    camDist * Math.sin(rotY) * Math.cos(rotX),
    camDist * Math.sin(rotX),
    camDist * Math.cos(rotY) * Math.cos(rotX),
  ];
  const forward = vec3.normalize(vec3.scale(camPos, -1));
  let right = vec3.cross([0, 1, 0], forward);
  right = vec3.length(right) < 1e-6 ? [1, 0, 0] : vec3.normalize(right);
  const up = vec3.cross(forward, right);
  const toCamera = v => {
    const rel = vec3.sub(v, camPos);
    return [vec3.dot(rel, right), vec3.dot(rel, up), vec3.dot(rel, forward)];
  };
  const project = (vCam, w, h) => {
    const z = Math.max(vCam[2], 0.05);
    const s = FOCAL / z;
    return { x: w / 2 + vCam[0] * s, y: h / 2 - vCam[1] * s, z };
  };
  return { camPos, toCamera, project };
}

function shadeColor(hex, intensity) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const amb = 0.28, k = amb + (1 - amb) * intensity;
  return `rgb(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)})`;
}

function renderLoop() {
  requestAnimationFrame(renderLoop);
  if (!ctx3d) return;
  const w = host3d._cssW, h = host3d._cssH;
  ctx3d.clearRect(0, 0, w, h);
  const cam = makeCamera();

  if (document.getElementById('gridChk').checked) drawGrid3D(cam, w, h);
  if (document.getElementById('axesChk').checked) drawAxes3D(cam, w, h);
  if (currentMesh) drawMesh3D(cam, w, h, currentMesh, document.getElementById('wireChk').checked);
}

function projLine(cam, w, h, a, b) {
  const ca = cam.toCamera(a), cb = cam.toCamera(b);
  if (ca[2] <= 0.05 || cb[2] <= 0.05) return null;
  return [cam.project(ca, w, h), cam.project(cb, w, h)];
}

function drawGrid3D(cam, w, h) {
  const N = 4;
  ctx3d.strokeStyle = 'rgba(94,230,200,0.16)';
  ctx3d.lineWidth = 1;
  for (let i = -N; i <= N; i++) {
    let seg = projLine(cam, w, h, [-N, 0, i], [N, 0, i]);
    if (seg) { ctx3d.beginPath(); ctx3d.moveTo(seg[0].x, seg[0].y); ctx3d.lineTo(seg[1].x, seg[1].y); ctx3d.stroke(); }
    seg = projLine(cam, w, h, [i, 0, -N], [i, 0, N]);
    if (seg) { ctx3d.beginPath(); ctx3d.moveTo(seg[0].x, seg[0].y); ctx3d.lineTo(seg[1].x, seg[1].y); ctx3d.stroke(); }
  }
}

function drawAxes3D(cam, w, h) {
  const axes = [
    { to: [3, 0, 0], color: '#e05d6f' },
    { to: [0, 3, 0], color: '#5ee6c8' },
    { to: [0, 0, 3], color: '#f2a65a' },
  ];
  axes.forEach(({ to, color }) => {
    const seg = projLine(cam, w, h, [0, 0, 0], to);
    if (!seg) return;
    ctx3d.strokeStyle = color; ctx3d.lineWidth = 2;
    ctx3d.beginPath(); ctx3d.moveTo(seg[0].x, seg[0].y); ctx3d.lineTo(seg[1].x, seg[1].y); ctx3d.stroke();
  });
}

function drawMesh3D(cam, w, h, mesh, wireframe) {
  const camVerts = mesh.vertices.map(cam.toCamera);
  const screenVerts = camVerts.map(v => cam.project(v, w, h));

  const faceData = mesh.faces.map(f => {
    const [i, j, k] = f;
    const a = mesh.vertices[i], b = mesh.vertices[j], c = mesh.vertices[k];
    const normal = vec3.normalize(vec3.cross(vec3.sub(b, a), vec3.sub(c, a)));
    const depth = (camVerts[i][2] + camVerts[j][2] + camVerts[k][2]) / 3;
    const intensity = Math.max(0, Math.abs(vec3.dot(normal, LIGHT_DIR)));
    return { f, depth, intensity };
  }).sort((x, y) => y.depth - x.depth);   // painter's algorithm: far to near

  faceData.forEach(({ f, intensity }) => {
    const [i, j, k] = f;
    const p1 = screenVerts[i], p2 = screenVerts[j], p3 = screenVerts[k];
    if (p1.z <= 0.05 || p2.z <= 0.05 || p3.z <= 0.05) return;
    ctx3d.beginPath();
    ctx3d.moveTo(p1.x, p1.y); ctx3d.lineTo(p2.x, p2.y); ctx3d.lineTo(p3.x, p3.y); ctx3d.closePath();
    if (wireframe) {
      ctx3d.strokeStyle = '#5ee6c8'; ctx3d.lineWidth = 1; ctx3d.stroke();
    } else {
      ctx3d.fillStyle = shadeColor('#5ee6c8', intensity);
      ctx3d.fill();
      ctx3d.strokeStyle = 'rgba(0,0,0,0.2)'; ctx3d.lineWidth = 0.6; ctx3d.stroke();
    }
  });
}

function setMesh(mesh) { currentMesh = mesh; }

// preset buttons (easier options for people who dont wanna code)
const presetSelect = document.getElementById('presetSelect');
const paramALabel = document.getElementById('paramALabel');
const paramBLabel = document.getElementById('paramBLabel');
presetSelect.onchange = () => {
  const p = presetSelect.value;
  paramALabel.textContent = p === 'lathe' ? 'Segments' : 'Depth';
  paramBLabel.textContent = p === 'twist' ? 'Twist (turns)' : (p === 'lathe' ? '—' : 'Layers');
};

document.getElementById('applyPresetBtn').onclick = () => {
  const pts = normalizedShapePoints();
  if (!pts) { alert('Draw a shape with at least 3 points first (2D → 3D panel).'); return; }
  const preset = presetSelect.value;
  const a = parseFloat(document.getElementById('paramA').value) || 1;
  const b = parseFloat(document.getElementById('paramB').value) || 12;

  if (preset === 'extrude') {
    setMesh(buildExtrude(pts, a));
  } else if (preset === 'lathe') {
    const minX = Math.min(...pts.map(p => p.x));
    const profile = pts.map(p => ({ x: p.x - minX, y: p.y }));
    setMesh(buildLathe(profile, Math.max(4, a | 0)));
  } else if (preset === 'twist') {
    setMesh(buildTwist(pts, a, b, Math.max(2, (b | 0) * 6)));
  }
};

// this is for the "write your own code" box, so people can mess with the shape directly
function defaultCode() {
  return `// points = your drawn 2d shape, just an array of {x, y}
// lib has some helper functions i made so you dont have to write everything:
//   lib.vec3  -> add/sub/scale/dot/cross/normalize
//   lib.triangulate(points2D)
//   lib.extrude(points2D, depth)
//   lib.lathe(profile2D, segments)
//   lib.twist(points2D, depth, turns, layers)
// just return { vertices: [[x,y,z],...], faces: [[i,j,k],...] } at the end

// example - extrude it normally then make the middle bulge out a bit
const mesh = lib.extrude(points, 2.4);
mesh.vertices = mesh.vertices.map(([x, y, z]) => {
  const bulge = 1 + 0.4 * Math.cos((z / 2.4) * Math.PI); // just a cosine curve, makes it fat in the middle
  return [x * bulge, y * bulge, z];
});
return mesh;`;
}

document.getElementById('runCodeBtn').onclick = () => {
  const pts = normalizedShapePoints();
  const status = document.getElementById('codeStatus');
  if (!pts) { status.className = 'err'; status.textContent = 'Draw a shape with at least 3 points first.'; return; }
  const code = document.getElementById('codeBox').value;
  try {
    const fn = new Function('points', 'lib', code);
    const result = fn(pts, meshLib);
    if (!result || !Array.isArray(result.vertices) || !Array.isArray(result.faces)) {
      throw new Error('Code must return { vertices: [[x,y,z],...], faces: [[i,j,k],...] }.');
    }
    setMesh(result);
    status.className = 'ok';
    status.textContent = `✓ rendered — ${result.vertices.length} vertices, ${result.faces.length} faces`;
  } catch (err) {
    status.className = 'err';
    status.textContent = 'Error: ' + err.message;
  }
};
</script>
